name: collect-parking

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect
        run: python collect.py
        env:
          API_KEY: ${{ secrets.PARKING_API_KEY }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parking_log.csv
          git diff --staged --quiet || (git commit -m "data: $(TZ=Asia/Seoul date '+%F %H:%M')" && git pull --rebase && git push)
